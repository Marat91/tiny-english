name = "tiny-english"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
APP_URL = "https://marat91.github.io/tiny-english/"
BOT_USERNAME = "Tiny_English_bot"

# Раз в час проверяем, кому пора напомнить
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tiny-english"
database_id = "5743b834-75b4-4b38-9506-3eec08b6fa95"

# Токен бота хранится как секрет и в этот файл не попадает:
#   npx wrangler secret put BOT_TOKEN
