<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tiny English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --sky:#dff3ff; --sky2:#bfe6ff; --ink:#23324a; --muted:#6b7a90;
  --card:#ffffff; --blue:#3b82f6; --blue-d:#2563eb; --yellow:#ffd43b;
  --green:#34c38f; --red:#ff6b6b; --pink:#ff8fab; --orange:#ff9f43;
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:linear-gradient(180deg,var(--sky),var(--sky2)) fixed;
  -webkit-user-select:none;user-select:none;overflow-x:hidden;
}
#app{max-width:900px;margin:0 auto;padding:16px 16px 40px;min-height:100%}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
h1{font-size:clamp(26px,4.5vw,40px);margin:8px 0 4px;text-align:center}
h2{font-size:clamp(20px,3.4vw,28px);margin:0 0 12px;text-align:center}
.sub{color:var(--muted);text-align:center;font-size:clamp(15px,2.4vw,19px);margin:0 0 16px}

.btn{background:var(--blue);color:#fff;font-weight:800;font-size:clamp(18px,3vw,24px);
  padding:16px 28px;border-radius:999px;box-shadow:0 6px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 6px 0 #cfe2ff}
.btn.round{width:72px;height:72px;padding:0;font-size:32px;border-radius:50%}
.btn.big-round{width:120px;height:120px;font-size:54px;border-radius:50%;padding:0}
.center{display:flex;flex-direction:column;align-items:center;gap:16px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chip{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:clamp(16px,2.6vw,20px);
  box-shadow:0 3px 0 rgba(35,50,74,.08);display:flex;align-items:center;gap:6px}
.top .grow{flex:1}

/* dog */
.dogwrap{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.dog{width:clamp(150px,30vw,230px);animation:breathe 3s ease-in-out infinite;cursor:pointer}
.dog.small{width:clamp(84px,14vw,120px)}
.dog.jump{animation:jump .6s ease}
.dog.sad{animation:shake .4s ease}
@keyframes breathe{50%{transform:translateY(-4px) scale(1.02)}}
@keyframes jump{30%{transform:translateY(-26px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bubble{background:#fff;border-radius:22px;padding:14px 18px;font-weight:700;font-size:clamp(16px,2.6vw,21px);
  max-width:340px;position:relative;box-shadow:0 4px 0 rgba(35,50,74,.08)}
.bubble small{display:block;color:var(--muted);font-weight:600;margin-top:4px}
.toybar{background:#fff;border-radius:999px;height:18px;overflow:hidden;max-width:420px;margin:6px auto 4px}
.toybar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .5s}

/* lesson map */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.lcard{background:var(--card);border-radius:var(--r);padding:18px;text-align:center;box-shadow:0 6px 0 rgba(35,50,74,.1);
  transition:transform .08s;position:relative;display:block;width:100%}
.lcard:active{transform:translateY(3px)}
.lcard .num{color:var(--muted);font-weight:700;font-size:15px}
.lcard .ls{font-size:clamp(28px,4.6vw,38px);font-weight:900;letter-spacing:6px;margin:6px 0}
.lcard .st{font-size:24px;letter-spacing:2px}
.lcard.locked{opacity:.55;filter:grayscale(.6)}
.lcard.soon{background:rgba(255,255,255,.55);box-shadow:none}
.c0 .ls{color:#ef4444}.c1 .ls{color:#f59e0b}.c2 .ls{color:#10b981}.c3 .ls{color:#3b82f6}.c4 .ls{color:#8b5cf6}.c5 .ls{color:#ec4899}

/* profiles */
.plist{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:20px 0}
.pcard{background:#fff;border-radius:var(--r);padding:20px;width:160px;text-align:center;box-shadow:0 6px 0 rgba(35,50,74,.1);font-weight:800;font-size:20px}
.pcard .av{font-size:64px;display:block}
.pcard small{display:block;color:var(--muted);font-weight:700;font-size:15px;margin-top:4px}
.pcard.add{background:rgba(255,255,255,.6);box-shadow:none;border:3px dashed #9cc8ee;color:var(--blue)}
.avs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.avs button{font-size:44px;width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid transparent}
.avs button.sel{border-color:var(--blue)}
input.name{font:inherit;font-size:24px;font-weight:700;padding:14px 20px;border-radius:999px;border:3px solid #9cc8ee;
  text-align:center;width:min(360px,90%);outline:none;color:var(--ink);-webkit-user-select:text;user-select:text}
input.name:focus{border-color:var(--blue)}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.x{width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;font-weight:900;color:var(--muted)}
.prog{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.stage{background:var(--card);border-radius:32px;padding:clamp(18px,3.5vw,32px);box-shadow:0 8px 0 rgba(35,50,74,.1);text-align:center}
.task{font-size:clamp(19px,3.2vw,26px);font-weight:800;margin:0 0 14px}
.bigletter{font-size:clamp(90px,20vw,170px);font-weight:900;line-height:1;margin:0}
.bigletter .up{color:var(--blue)} .bigletter .lo{color:var(--orange)}
.ruhint{font-size:clamp(20px,3.4vw,28px);color:var(--muted);font-weight:700;margin:6px 0 14px}
.wordrow{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--sky);border-radius:24px;padding:14px 20px;margin:0 auto 18px;max-width:460px;width:100%}
.wordrow .em{font-size:clamp(54px,10vw,84px);line-height:1}
.wordrow .w{font-size:clamp(30px,5.4vw,44px);font-weight:900;text-align:left}
.wordrow .w b{color:var(--red)}
.wordrow .w small{display:block;font-size:.5em;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;margin:18px auto 0}
.opt{background:#fff;border:4px solid #d6e6f5;border-radius:24px;padding:18px 8px;font-size:clamp(40px,8vw,64px);font-weight:900;
  box-shadow:0 6px 0 #d6e6f5;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#d9f7ea;border-color:var(--green);box-shadow:0 6px 0 var(--green)}
.opt.no{background:#ffe3e3;border-color:var(--red);box-shadow:0 6px 0 var(--red);animation:shake .4s}
.opt .lo{color:var(--orange)} .opt .up{color:var(--blue)}
.bigem{font-size:clamp(80px,16vw,130px);line-height:1.1}
.gap{font-size:clamp(40px,8vw,64px);font-weight:900;letter-spacing:6px;margin:4px 0}
.gap u{color:var(--red);text-decoration:none;border-bottom:6px solid var(--red);min-width:.7em;display:inline-block}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:0 auto}
.pc{aspect-ratio:1;border-radius:20px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);font-size:clamp(34px,7vw,56px);font-weight:900;color:#fff;position:relative}
.pc .front{display:none}
.pc.open{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d6e6f5}
.pc.open .front{display:inline}.pc.open .back{display:none}
.pc.ok{background:#d9f7ea;box-shadow:0 5px 0 var(--green)}
.stars{font-size:clamp(54px,11vw,84px);letter-spacing:8px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.gift{background:#fff7d6;border:3px dashed var(--yellow);border-radius:20px;padding:12px 18px;font-weight:800;font-size:20px;margin:10px auto;display:inline-block}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.abc button{background:#fff;border-radius:18px;padding:10px 4px;font-size:30px;font-weight:900;box-shadow:0 4px 0 rgba(35,50,74,.1)}
.abc button span{display:block;font-size:30px}
.abc button.cur{outline:4px solid var(--blue)}
.note{background:#fff7d6;border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= Данные ================= */
const LETTERS = [
  ['A','эй','apple','🍎','яблоко'],   ['B','би','ball','⚽','мяч'],
  ['C','си','cat','🐱','кот'],         ['D','ди','dog','🐶','собака'],
  ['E','и','egg','🥚','яйцо'],         ['F','эф','fish','🐟','рыба'],
  ['G','джи','goat','🐐','коза'],      ['H','эйч','hat','🎩','шляпа'],
  ['I','ай','ice cream','🍦','мороженое'], ['J','джей','juice','🧃','сок'],
  ['K','кей','key','🔑','ключ'],       ['L','эл','lion','🦁','лев'],
  ['M','эм','moon','🌙','луна'],       ['N','эн','nose','👃','нос'],
  ['O','оу','orange','🍊','апельсин'], ['P','пи','pig','🐷','свинка'],
  ['Q','кью','queen','👑','королева'], ['R','ар','rabbit','🐰','кролик'],
  ['S','эс','sun','☀️','солнце'],      ['T','ти','tree','🌳','дерево'],
  ['U','ю','umbrella','☂️','зонт'],    ['V','ви','violin','🎻','скрипка'],
  ['W','дабл-ю','whale','🐳','кит'],   ['X','экс','fox','🦊','лиса'],
  ['Y','уай','yo-yo','🪀','йо-йо'],    ['Z','зи','zebra','🦓','зебра'],
].map(([u,ru,word,emoji,tr]) => ({u, l:u.toLowerCase(), ru, word, emoji, tr}));

const RANGES = [[0,4],[4,8],[8,12],[12,16],[16,20],[20,26]];
const LESSONS = RANGES.map(([a,b]) => LETTERS.slice(a,b));
const SOON = ['🎨 Цвета','🐾 Животные','🔢 Цифры','👨‍👩‍👧 Семья'];
const TOYS = [
  {at:3,  name:'красный ошейник', icon:'📿'},
  {at:7,  name:'бантик',          icon:'🎀'},
  {at:11, name:'крутые очки',     icon:'🕶️'},
  {at:15, name:'корона',          icon:'👑'},
];
const AVATARS = ['👧','👦','🧒','👩','👨','👵','👴','🦸'];
const DOG = 'Бадди';

/* ================= Хранилище ================= */
const KEY = 'buddy-v1';
let db = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null } catch(e){ return null } })() || {profiles:[], cur:null};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)) } catch(e){} };
const me = () => db.profiles.find(p => p.id === db.cur);
const total = p => Object.values(p.stars).reduce((a,b) => a+b, 0);
const dayStr = d => { const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()) };
function touchStreak(p){
  const today = dayStr(new Date());
  if (p.last === today) return;
  const y = dayStr(new Date(Date.now() - 864e5));
  p.streak = p.last === y ? (p.streak||0) + 1 : 1;
  p.last = today;
}
function liveStreak(p){
  const today = dayStr(new Date()), y = dayStr(new Date(Date.now() - 864e5));
  return (p.last === today || p.last === y) ? (p.streak||0) : 0;
}

/* ================= Звук ================= */
const canSpeak = 'speechSynthesis' in window;
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices();
  voice = v.find(x => /en[-_]US/i.test(x.lang) && /Samantha|Google US|Aria|Jenny|Ava/i.test(x.name))
       || v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
}
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(...texts){
  if (!canSpeak) return;
  speechSynthesis.cancel();
  texts.forEach(t => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = 0.75;
    speechSynthesis.speak(u);
  });
}
let ac;
function tone(f, d, type='sine', t0=0){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + t0;
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
const ding = () => { tone(660,.15); tone(880,.25,'sine',.12) };
const buzz = () => tone(180,.25,'triangle');
const fanfare = () => [523,659,784,1047].forEach((f,i) => tone(f,.3,'sine',i*.14));

/* ================= Помощники ================= */
const app = document.getElementById('app');
const $ = s => app.querySelector(s);
const $$ = s => [...app.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a };
const pick = a => a[Math.floor(Math.random()*a.length)];
const render = html => { app.innerHTML = html; window.scrollTo(0,0) };
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand() } catch(e){} }

function dogSVG(stars, cls=''){
  const has = n => stars >= n;
  return `<svg class="dog ${cls}" viewBox="0 -14 200 196" aria-label="${DOG}">
    <ellipse cx="50" cy="88" rx="24" ry="46" fill="#8a5a3b" transform="rotate(18 50 88)"/>
    <ellipse cx="150" cy="88" rx="24" ry="46" fill="#8a5a3b" transform="rotate(-18 150 88)"/>
    <circle cx="100" cy="100" r="62" fill="#f0c283"/>
    <ellipse cx="127" cy="80" rx="21" ry="23" fill="#d39a5b"/>
    <ellipse cx="100" cy="123" rx="33" ry="26" fill="#fff6e6"/>
    <circle cx="77" cy="88" r="8.5" fill="#2b2118"/><circle cx="80" cy="85" r="2.8" fill="#fff"/>
    <circle cx="125" cy="88" r="8.5" fill="#2b2118"/><circle cx="128" cy="85" r="2.8" fill="#fff"/>
    <circle cx="62" cy="108" r="8" fill="#ff9aa2" opacity=".5"/><circle cx="138" cy="108" r="8" fill="#ff9aa2" opacity=".5"/>
    <path d="M93 131 q7 20 14 0 z" fill="#ff7b8a"/>
    <path d="M100 116 v9 M100 125 q-10 11 -21 2 M100 125 q10 11 21 2" stroke="#2b2118" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="110" rx="10.5" ry="7.5" fill="#2b2118"/>
    ${has(3) ? `<path d="M60 151 q40 20 80 0" stroke="#e5484d" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="100" cy="164" r="7.5" fill="#ffd43b" stroke="#e0a800" stroke-width="2"/>` : ''}
    ${has(7) ? `<g transform="translate(46 44) rotate(-20)"><path d="M0 0 l-18 -12 v24 z M0 0 l18 -12 v24 z" fill="#ff8fab"/><circle r="6" fill="#ff5c8a"/></g>` : ''}
    ${has(11) ? `<g fill="#23324a"><rect x="60" y="76" width="34" height="24" rx="9"/><rect x="108" y="76" width="34" height="24" rx="9"/><rect x="92" y="82" width="18" height="5"/></g>` : ''}
    ${has(15) ? `<path d="M70 44 l6 -30 l14 18 l10 -26 l10 26 l14 -18 l6 30 z" fill="#ffd43b" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/>` : ''}
  </svg>`;
}
function dogReact(kind){
  const d = $('.dog'); if (!d) return;
  d.classList.remove('jump','sad'); void d.getBoundingClientRect();
  d.classList.add(kind === 'ok' ? 'jump' : 'sad');
}

/* ================= Экран: профили ================= */
function profiles(){
  render(`
    <div class="center" style="margin-top:8px">${dogSVG(0)}</div>
    <h1>Tiny English</h1>
    <p class="sub">Кто сегодня занимается с ${DOG}?</p>
    <div class="plist">
      ${db.profiles.map(p => `<button class="pcard" data-id="${p.id}"><span class="av">${p.avatar}</span>${esc(p.name)}<small>⭐ ${total(p)} · 🔥 ${liveStreak(p)}</small></button>`).join('')}
      <button class="pcard add" id="add"><span class="av">➕</span>Добавить</button>
    </div>`);
  $$('.pcard[data-id]').forEach(b => b.onclick = () => { db.cur = b.dataset.id; save(); home() });
  $('#add').onclick = addProfile;
}
function addProfile(){
  let av = AVATARS[0];
  const tgName = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && !db.profiles.length ? tg.initDataUnsafe.user.first_name : '';
  render(`
    <h1>Новый ученик</h1>
    <p class="sub">Выбери картинку и напиши имя</p>
    <div class="center">
      <div class="avs">${AVATARS.map(a => `<button data-a="${a}" class="${a===av?'sel':''}">${a}</button>`).join('')}</div>
      <input class="name" id="nm" maxlength="14" placeholder="Имя" value="${esc(tgName||'')}">
      <div class="row">
        ${db.profiles.length ? '<button class="btn ghost" id="back">Назад</button>' : ''}
        <button class="btn" id="ok">Готово!</button>
      </div>
    </div>`);
  $$('.avs button').forEach(b => b.onclick = () => { av = b.dataset.a; $$('.avs button').forEach(x => x.classList.toggle('sel', x===b)) });
  if ($('#back')) $('#back').onclick = profiles;
  $('#ok').onclick = () => {
    const name = $('#nm').value.trim();
    if (!name) { $('#nm').focus(); return }
    const p = {id:'p'+Date.now(), name, avatar:av, stars:{}, streak:0, last:null};
    db.profiles.push(p); db.cur = p.id; save(); home();
  };
}

/* ================= Экран: главная ================= */
function home(){
  const p = me(); if (!p) return profiles();
  const t = total(p);
  const nextToy = TOYS.find(x => x.at > t);
  const prevAt = [...TOYS].reverse().find(x => x.at <= t)?.at || 0;
  const hello = pick([
    ['Hello, '+esc(p.name)+'!', 'Привет! Поиграем в буквы?'],
    ['Woof! Hi, '+esc(p.name)+'!', 'Гав! Я соскучился!'],
    ['Let\'s play!', 'Давай играть!'],
  ]);
  render(`
    <div class="top">
      <button class="chip" id="who">${p.avatar} ${esc(p.name)}</button>
      <span class="grow"></span>
      <span class="chip">⭐ ${t}</span>
      <span class="chip">🔥 ${liveStreak(p)}</span>
    </div>
    <div class="dogwrap">
      ${dogSVG(t)}
      <div class="bubble">${hello[0]}<small>${hello[1]}</small></div>
    </div>
    ${nextToy
      ? `<p class="sub" style="margin-bottom:4px">Ещё ${nextToy.at - t} ⭐ — и у ${DOG} появится ${nextToy.icon} ${nextToy.name}</p>
         <div class="toybar"><i style="width:${Math.round((t-prevAt)/(nextToy.at-prevAt)*100)}%"></i></div>`
      : `<p class="sub">У ${DOG} есть все подарки! 🎉</p>`}
    ${canSpeak ? '' : '<div class="note">🔇 В этом браузере нет озвучки — буквы не будут произноситься.</div>'}
    <div class="grid">
      ${LESSONS.map((set,i) => {
        const st = p.stars[i] || 0, locked = i > 0 && !(p.stars[i-1] > 0);
        return `<button class="lcard c${i} ${locked?'locked':''}" data-i="${i}">
          <div class="num">Урок ${i+1}</div>
          <div class="ls">${set.map(L => L.u).join('')}</div>
          <div class="st">${locked ? '🔒' : '⭐'.repeat(st) + '☆'.repeat(3-st)}</div>
        </button>`}).join('')}
      <button class="lcard" id="abc"><div class="num">Все буквы</div><div class="ls" style="letter-spacing:2px">🔤</div><div class="st" style="font-size:18px;font-weight:800">Алфавит</div></button>
      ${SOON.map(s => `<div class="lcard soon"><div class="num">Скоро</div><div class="ls" style="font-size:22px;letter-spacing:0">${s}</div><div class="st">🔒</div></div>`).join('')}
    </div>`);
  $('#who').onclick = profiles;
  $('#abc').onclick = () => alphabet();
  $('.dog').onclick = () => { dogReact('ok'); say('Woof! Hello, ' + p.name + '!') };
  $$('.lcard[data-i]').forEach(b => b.onclick = () => {
    if (b.classList.contains('locked')) { buzz(); dogReact('no'); return }
    startLesson(+b.dataset.i);
  });
}

/* ================= Экран: алфавит ================= */
function alphabet(cur){
  const L = cur || LETTERS[0];
  render(`
    <div class="lbar"><button class="x" id="x">←</button><h2 style="margin:0;flex:1">Алфавит</h2><span style="width:48px"></span></div>
    <div class="stage">
      <p class="bigletter" style="font-size:clamp(70px,14vw,120px)"><span class="up">${L.u}</span><span class="lo">${L.l}</span></p>
      <p class="ruhint">буква читается «${L.ru}»</p>
      <div class="wordrow" id="wr"><span class="em">${L.emoji}</span><span class="w">${markWord(L)}<small>${L.tr}</small></span></div>
    </div>
    <div class="abc">${LETTERS.map(x => `<button data-u="${x.u}" class="${x===L?'cur':''}"><span>${x.u}${x.l}</span></button>`).join('')}</div>`);
  $('#x').onclick = home;
  $('#wr').onclick = () => say(L.word);
  $('.bigletter').onclick = () => say(L.u);
  $$('.abc button').forEach(b => b.onclick = () => { const n = LETTERS.find(x => x.u === b.dataset.u); alphabet(n); say(n.u, n.word) });
}
function markWord(L){
  const i = L.word.toLowerCase().indexOf(L.l);
  return esc(L.word.slice(0,i)) + '<b>' + L.word[i] + '</b>' + esc(L.word.slice(i+1));
}

/* ================= Урок ================= */
let S = null;
function startLesson(i){
  const set = LESSONS[i];
  let listen = shuffle([...set, ...set]);
  for (let k=0; k<30 && listen.some((x,j) => j && x === listen[j-1]); k++) listen = shuffle(listen);
  const steps = [
    ...set.map(L => ({t:'intro', L})),
    ...listen.map(L => ({t:'listen', L})),
    ...shuffle(set).map(L => ({t:'missing', L})),
    {t:'pairs', set},
  ];
  S = {i, steps, pos:0, mistakes:0, pool: LETTERS.slice(0, RANGES[i][1])};
  step();
}
function frame(inner){
  render(`
    <div class="lbar"><button class="x" id="x">✕</button><div class="prog"><i style="width:${Math.round(S.pos/S.steps.length*100)}%"></i></div></div>
    <div class="stage">${inner}</div>`);
  $('#x').onclick = () => { if (canSpeak) speechSynthesis.cancel(); S = null; home() };
}
function advance(){ if (!S) return; S.pos++; S.pos >= S.steps.length ? finish() : step() }
function step(){
  const st = S.steps[S.pos];
  ({intro, listen, missing, pairs})[st.t](st);
}
function options(L){
  const others = shuffle(S.pool.filter(x => x !== L)).slice(0,3);
  return shuffle([L, ...others]);
}
function wireOptions(L, onRight){
  let locked = false;
  $$('.opt').forEach(b => b.onclick = () => {
    if (locked || b.classList.contains('no')) return;
    if (b.dataset.u === L.u){
      locked = true; b.classList.add('ok'); ding(); dogReact('ok'); onRight();
    } else {
      b.classList.add('no'); buzz(); dogReact('no'); S.mistakes++;
    }
  });
}

function intro({L}){
  frame(`
    <p class="task">Новая буква! Нажимай и слушай 👂</p>
    <p class="bigletter" id="bl"><span class="up">${L.u}</span><span class="lo">${L.l}</span></p>
    <p class="ruhint">читается «${L.ru}»</p>
    <button class="wordrow" id="wr"><span class="em">${L.emoji}</span><span class="w">${markWord(L)}<small>${L.tr}</small></span></button>
    <div class="row"><button class="btn round ghost" id="snd">🔊</button><button class="btn" id="go">Дальше →</button></div>`);
  $('#bl').onclick = $('#snd').onclick = () => say(L.u);
  $('#wr').onclick = () => say(L.word);
  $('#go').onclick = advance;
  say(L.u, L.word);
}

function listen({L}){
  frame(`
    <div class="row">${dogSVG(total(me()),'small')}<p class="task" style="margin:0">Послушай и найди букву</p></div>
    <div class="center" style="margin-top:10px"><button class="btn big-round" id="snd">🔊</button></div>
    <div class="opts">${options(L).map(o => `<button class="opt" data-u="${o.u}"><span class="up">${o.u}</span><span class="lo">${o.l}</span></button>`).join('')}</div>`);
  $('#snd').onclick = () => say(L.u);
  wireOptions(L, () => setTimeout(advance, 900));
  say(L.u);
}

function missing({L}){
  const i = L.word.toLowerCase().indexOf(L.l);
  const gap = filled => esc(L.word.slice(0,i)) + '<u>' + (filled ? L.word[i] : '&nbsp;') + '</u>' + esc(L.word.slice(i+1));
  frame(`
    <p class="task">Какой буквы не хватает?</p>
    <div class="bigem" id="em">${L.emoji}</div>
    <div class="gap" id="gap">${gap(false)}</div>
    <p class="ruhint" style="margin:0">${L.tr}</p>
    <div class="opts">${options(L).map(o => `<button class="opt" data-u="${o.u}"><span class="lo">${o.l}</span></button>`).join('')}</div>`);
  $('#em').onclick = () => say(L.word);
  wireOptions(L, () => { $('#gap').innerHTML = gap(true); setTimeout(() => say(L.word), 350); setTimeout(advance, 1700) });
  say(L.word);
}

function pairs({set}){
  const cards = shuffle(set.flatMap(L => [{k:L.u, s:L.u}, {k:L.u, s:L.l}]));
  let open = [], done = 0, lock = false;
  frame(`
    <p class="task">Найди пары: большая и маленькая буква</p>
    <div class="pairs">${cards.map((c,i) => `<button class="pc" data-i="${i}"><span class="back">🐾</span><span class="front">${c.s}</span></button>`).join('')}</div>`);
  $$('.pc').forEach(b => b.onclick = () => {
    if (lock || b.classList.contains('open')) return;
    b.classList.add('open'); say(cards[+b.dataset.i].k); open.push(b);
    if (open.length < 2) return;
    const [a, c] = open; open = [];
    if (cards[+a.dataset.i].k === cards[+c.dataset.i].k){
      a.classList.add('ok'); c.classList.add('ok'); ding();
      if (++done === set.length) setTimeout(advance, 1000);
    } else {
      lock = true;
      setTimeout(() => { a.classList.remove('open'); c.classList.remove('open'); lock = false }, 900);
    }
  });
}

function finish(){
  const p = me(), before = total(p);
  const stars = S.mistakes <= 1 ? 3 : S.mistakes <= 4 ? 2 : 1;
  p.stars[S.i] = Math.max(p.stars[S.i] || 0, stars);
  touchStreak(p); save();
  const after = total(p);
  const toy = TOYS.find(x => x.at > before && x.at <= after);
  const praise = stars === 3 ? ['Excellent!','Отлично!'] : stars === 2 ? ['Good job!','Хорошая работа!'] : ['Nice try!','Неплохо! Попробуй ещё раз — получится лучше'];
  render(`
    <div class="stage" style="margin-top:24px">
      <div class="center">
        ${dogSVG(after,'jump')}
        <h1>${praise[0]}</h1>
        <p class="sub" style="margin:0">${praise[1]}</p>
        <div class="stars">${[1,2,3].map(n => `<span class="${n<=stars?'':'off'}">⭐</span>`).join('')}</div>
        ${toy ? `<div class="gift">🎁 Новый подарок для ${DOG}: ${toy.icon} ${toy.name}!</div>` : ''}
        <div class="row">
          <button class="btn ghost" id="again">Ещё раз</button>
          <button class="btn" id="home">Дальше →</button>
        </div>
      </div>
    </div>`);
  fanfare(); setTimeout(() => say(praise[0]), 700);
  const i = S.i; S = null;
  $('#again').onclick = () => startLesson(i);
  $('#home').onclick = home;
}

/* ================= Старт ================= */
db.profiles.length ? (me() ? home() : profiles()) : addProfile();
</script>
</body>
</html>
